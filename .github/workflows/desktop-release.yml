name: Release Desktop App

on:
  # Release publishing is handled by desktop-build.yml to avoid duplicate assets.
  # Keep this workflow manual-only for emergency rebuilds.
  workflow_dispatch:

permissions:
  contents: read  # 仅限读取，无需发布权限

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-2025
            platform: win

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: desktop

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ matrix.os }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Build frontend
        working-directory: desktop
        run: npx electron-vite build

      - name: Download VC++ Redistributable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path buildResources/vcredist
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "buildResources/vcredist/vc_redist.x64.exe"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r python-backend/requirements.txt pyinstaller==6.14.0

      - name: Build Python backend
        working-directory: desktop/python-backend
        shell: bash
        run: |
          rm -rf ../build-backend ../dist-backend
          pyinstaller build.spec --distpath ../dist-backend --workpath ../build-backend --clean

      # ---- macOS code signing (conditional) ----
      - name: Check macOS signing secret
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "HAS_CSC_LINK=true" >> $GITHUB_ENV
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}

      - name: Build Electron app (macOS, with signing)
        if: matrix.platform == 'mac' && env.HAS_CSC_LINK == 'true'
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build Electron app (macOS, unsigned)
        if: matrix.platform == 'mac' && env.HAS_CSC_LINK != 'true'
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Build Electron app (non-macOS)
        if: matrix.platform != 'mac'
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-${{ matrix.platform }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/*.zip
            desktop/dist/*.snap
            desktop/dist/latest*.yml
          if-no-files-found: error
