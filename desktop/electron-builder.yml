appId: com.kzb12580.hermes-desktop
productName: Hermes Desktop
copyright: Copyright © 2024 kzb12580

directories:
  buildResources: buildResources
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tailwind.config.js,postcss.config.js}'
  - '!**/.env*'

# Bundle the Python backend as an extra resource
extraResources:
  # PyInstaller sidecar (可能在某些系统上不可用)
  - from: dist-backend/hermes-backend
    to: python-backend
    filter:
      - '**/*'
  # VC++ Runtime (Windows only, for sidecar DLL loading)
  - from: buildResources/vcredist
    to: vcredist
    filter:
      - '**/*'
  # 后端源码 (系统 Python fallback)
  - from: python-backend
    to: python-backend-source
    filter:
      - '**/*.py'
      - '**/*.js'
      - '**/*.json'
      - '**/*.txt'
      - '**/*.md'
      - '!**/.venv/**'
      - '!**/venv/**'
      - '!**/__pycache__/**'
      - '!**/dist/**'
      - '!**/build/**'
      - '!**/*.spec'
      - '!**/.env*'
  - from: buildResources/icon.png
    to: icon.png

win:
  executableName: hermes-desktop
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: buildResources/icon.ico

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: Hermes Desktop
  uninstallDisplayName: Hermes Desktop
  createDesktopShortcut: always
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.productivity
  entitlementsInherit: buildResources/entitlements.mac.plist
  icon: buildResources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  # Include arch because x64 and arm64 DMGs are built concurrently on macOS.
  # Without this, both hdiutil convert processes write the same output path and
  # one or both DMG builds fail intermittently.
  artifactName: ${name}-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  maintainer: kzb12580
  category: Utility
  icon: buildResources/icons
  artifactName: ${name}-${version}.${ext}

publish:
  provider: github
  owner: kzb12580
  repo: hermes-enhanced
  releaseType: release
